name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, flutterflow]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Add JitPack repository
        run: sed -i "s#mavenCentral()#mavenCentral()\n        maven { url 'https://jitpack.io' }#" android/build.gradle
      - name: Limit Gradle memory
        run: |
          sed -i 's/-Xmx6144m/-Xmx3g/' android/gradle.properties
          printf '\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n' >> android/gradle.properties
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: schatzapp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
